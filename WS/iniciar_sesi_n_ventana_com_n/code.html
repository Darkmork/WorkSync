<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .bg-pattern {
            background-color: #f8f9fa;
            background-image: radial-gradient(#0058be10 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
    </style>
</head>
<body class="bg-pattern min-h-screen flex flex-col font-body-md text-on-background">
<!-- Top Navigation Suppression: As per rules, login/transactional screens suppress the shell -->
<main class="flex-grow flex items-center justify-center px-mobile-margin py-section-padding relative overflow-hidden">
<!-- Abstract Brand Elements -->
<div class="absolute -top-24 -left-24 w-96 h-96 bg-primary opacity-5 rounded-full blur-3xl"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 bg-secondary opacity-5 rounded-full blur-3xl"></div>
<div class="w-full max-w-[440px] flex flex-col items-center">
<!-- Brand Logo Anchor -->
<div class="mb-8 flex items-center gap-3 transition-transform duration-300 hover:scale-105">
<div class="w-12 h-12 bg-primary rounded-xl flex items-center justify-center shadow-lg">
<span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings: 'FILL' 1;">window</span>
</div>
<h1 class="font-headline-md text-headline-md font-bold text-primary tracking-tight">Ventana Común</h1>
</div>
<!-- Login Card -->
<div class="glass-card w-full p-8 md:p-10 rounded-xl shadow-sm border border-border-subtle">
<div class="text-center mb-10">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-3">Encuentra el mejor momento para juntarte</h2>
<p class="font-body-md text-body-md text-on-surface-variant">La forma más sencilla de coordinar horarios con tu grupo de estudio o amigos.</p>
</div>
<!-- Google SSO (Primary Action) -->
<button class="w-full bg-white hover:bg-surface-container-low border border-outline-variant transition-all duration-200 flex items-center justify-center gap-3 py-3.5 px-6 rounded-lg shadow-sm active:scale-[0.98]">
<img alt="Google Logo" class="w-5 h-5" data-alt="The official Google 'G' icon rendered in high-definition with its characteristic four-color palette of red, yellow, green, and blue. The icon is clean and minimalist, presented on a pure white background as part of a modern, student-focused software interface. The surrounding aesthetic is bright and professional, emphasizing trust and accessibility in a coordination platform." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCOJ59Kjk3428jlur8kNyZ31efzt1GW0wZRHYevF_hNpEqpZyLGwL1ILu1KulrUIFoMr-Ubqz-6vcoFPlJgERvbqVIod6u3LTzIZU0ono88CNlhcWOXSWe9a21sE3XwO8KCShQeqY7L9wq4fQDPYA3eAzAV-o3JRTQ2U0w2Z8qbD_ITJiTcZxQxqNyHdzZEeXJRA3a2ZvKS5RaFnwFAx5mp8HicwRXMy9S9JRYTiZGSkglj-AXkDpSI2HMoU8iUTpUe1hHeskOO7ns"/>
<span class="font-body-md text-body-md font-semibold text-on-surface-variant">Continuar con Google</span>
</button>
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-label-sm">
<span class="px-4 bg-white text-outline font-label-sm uppercase tracking-widest">o usa tu correo</span>
</div>
</div>
<!-- Email Login Form -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<div class="space-y-2">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="email">Correo Electrónico</label>
<input class="w-full px-4 py-3 bg-surface border border-outline-variant focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all duration-200 outline-none font-body-md text-body-md rounded-lg" id="email" placeholder="nombre@universidad.edu" type="email"/>
</div>
<button class="w-full bg-primary hover:bg-primary-container text-white py-3.5 px-6 rounded-lg font-body-md text-body-md font-semibold shadow-md shadow-primary/20 transition-all duration-200 active:scale-[0.98]">
                        Iniciar Sesión
                    </button>
</form>
<!-- Support Links -->
<div class="mt-8 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                        ¿Nuevo aquí? 
                        <a class="text-primary font-bold hover:underline decoration-2 underline-offset-4 ml-1" href="#">Crea una cuenta</a>
</p>
</div>
</div>
<!-- Footer-style Links -->
<div class="mt-12 flex gap-6 text-label-sm font-label-sm text-outline">
<a class="hover:text-primary transition-colors" href="#">Privacidad</a>
<a class="hover:text-primary transition-colors" href="#">Términos</a>
<a class="hover:text-primary transition-colors" href="#">Ayuda</a>
</div>
</div>
</main>
<!-- Side Graphics for Desktop -->
<div class="hidden lg:block fixed left-12 top-1/2 -translate-y-1/2 w-48 opacity-20">
<div class="space-y-4">
<div class="h-12 w-full bg-primary-fixed rounded-full"></div>
<div class="h-12 w-3/4 bg-secondary-fixed rounded-full"></div>
<div class="h-12 w-1/2 bg-tertiary-fixed rounded-full"></div>
</div>
</div>
<div class="hidden lg:block fixed right-12 top-1/2 -translate-y-1/2 w-48 opacity-20 transform rotate-180">
<div class="space-y-4">
<div class="h-12 w-full bg-primary-fixed rounded-full"></div>
<div class="h-12 w-3/4 bg-secondary-fixed rounded-full"></div>
<div class="h-12 w-1/2 bg-tertiary-fixed rounded-full"></div>
</div>
</div>
<script>
        // Subtle micro-interaction for the login button
        const loginBtn = document.querySelector('form button');
        loginBtn.addEventListener('mouseenter', () => {
            loginBtn.classList.add('shadow-lg');
        });
        loginBtn.addEventListener('mouseleave', () => {
            loginBtn.classList.remove('shadow-lg');
        });

        // Background parallax effect
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            const bubbles = document.querySelectorAll('.absolute.rounded-full');
            bubbles.forEach((bubble, index) => {
                const speed = (index + 1) * 20;
                bubble.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>
</body></html>
